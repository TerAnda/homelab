# /etc/systemd/system/ollama.service.d/override.conf on mini (Ryzen 7 7840HS, Radeon 780M)
[Service]
Environment="OLLAMA_HOST=0.0.0.0:11434"
# 780M is gfx1103, not supported by Ollama's ROCm build -> report as gfx1102
Environment="HSA_OVERRIDE_GFX_VERSION=11.0.2"
# Ollama ignores integrated GPUs unless this is set
Environment="OLLAMA_IGPU_ENABLE=1"
